# @format

name: "Inventor Market: Automation"

on:
  workflow_dispatch:
  schedule:
    # Runs on Wednesday at 9:00 AM IST (03:30 AM UTC)
    - cron: "30 3 * * 3"

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    env:
      PASSED: "0"
      FAILED: "0"
      TOTAL: "0"
      REPORT_AVAILABLE: "false"
      REPORT_SECTION: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 1. Run Tests (Targeting Inventor Market Config)
      - name: Run Playwright Tests
        id: run_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test --config=inventormarket/playwright.config.js --workers=1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          CI: true

      # 2. Move Reports
      - name: Move Reports to Site Folder
        if: always()
        run: |
          mkdir -p inventormarket
          if [ -d "playwright-report" ]; then
            rm -rf inventormarket/playwright-report
            mv playwright-report inventormarket/
          fi
          if [ -f "results.json" ]; then
            mv results.json inventormarket/
          fi

      - name: Detect Report Availability
        if: always()
        shell: bash
        run: |
          if [ -d "inventormarket/playwright-report" ] && [ -f "inventormarket/playwright-report/index.html" ]; then
            echo "REPORT_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "REPORT_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      # 3. Calculate Stats
      - name: Calculate Test Stats
        if: always()
        run: |
          node -e "
            try {
              const fs = require('fs');
              if (fs.existsSync('./inventormarket/results.json')) {
                const r = require('./inventormarket/results.json');
                const passed = r.stats.expected + r.stats.flaky;
                const failed = r.stats.unexpected;
                console.log('PASSED=' + passed);
                console.log('FAILED=' + failed);
                console.log('TOTAL=' + (passed + failed));
              } else {
                console.log('PASSED=0');
                console.log('FAILED=Error');
                console.log('TOTAL=0');
              }
            } catch (e) {
              console.log('PASSED=0');
              console.log('FAILED=Crash');
              console.log('TOTAL=0');
            }
          " >> $GITHUB_ENV

      # 4. Upload Report Artifact
      - name: Upload Report Artifact
        id: upload_report
        if: always() && env.REPORT_AVAILABLE == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: inventormarket-report
          path: inventormarket/playwright-report/
          retention-days: 2

      - name: Prepare Report Message
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Always write REPORT_SECTION, never fail this step.
          {
            if [ "${REPORT_AVAILABLE}" = "true" ] && [ "${{ steps.upload_report.outcome }}" = "success" ]; then
              echo "REPORT_SECTION<<EOF"
              echo "📂 DOWNLOAD FULL REPORT:"
              echo "1. Open the link $RUN_URL"
              echo "2. Navigate to the \"Artifacts\" section."
              echo "3. Click \"inventormarket-report\" to download the ZIP file."
              echo "EOF"
            else
              echo "REPORT_SECTION<<EOF"
              echo "⚠️ ISSUE SUMMARY:"

              if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
                echo "- Tests failed (exit code: ${{ steps.run_tests.outputs.exit_code }})"
              else
                echo "- Tests step outcome: ${{ steps.run_tests.outcome }}"
              fi

              if [ "${REPORT_AVAILABLE}" != "true" ]; then
                echo "- Report not generated (inventormarket/playwright-report missing)"
                echo "  Likely cause: Playwright crashed early, reporters changed, or run was cancelled."
              else
                echo "- Report generated: yes"
                if [ "${{ steps.upload_report.outcome }}" != "success" ]; then
                  echo "- Artifact upload failed (outcome: ${{ steps.upload_report.outcome }})"
                  echo "  Possible causes: artifact quota/storage limit, artifact too large, transient GitHub issue."

                  # Best-effort: pull a few relevant lines from the run logs zip.
                  mkdir -p _runlogs || true
                  curl -sS -L \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs" \
                    -o _runlogs/logs.zip || true

                  if [ -f "_runlogs/logs.zip" ]; then
                    if command -v unzip >/dev/null 2>&1; then
                      unzip -q -o _runlogs/logs.zip -d _runlogs/extracted || true
                    else
                      python3 -c "import zipfile; zipfile.ZipFile('_runlogs/logs.zip').extractall('_runlogs/extracted')" \
                        || python -c "import zipfile; zipfile.ZipFile('_runlogs/logs.zip').extractall('_runlogs/extracted')" \
                        || true
                    fi

                    ERROR_LINES=$(grep -R -i -E "quota|artifact|too large|HTTP [45][0-9][0-9]|::error|Error:" _runlogs/extracted 2>/dev/null | tail -n 25 || true)

                    if [ -n "${ERROR_LINES:-}" ]; then
                      echo ""
                      echo "Artifact/log hints:"
                      echo "$ERROR_LINES"
                    fi
                  fi
                else
                  echo "- Artifact upload: skipped or not attempted"
                fi
              fi

              echo ""
              echo "Run logs: $RUN_URL"
              echo "EOF"
            fi
          } >> "$GITHUB_ENV" || true

      # 5. Send Email (Using the new Secret List)
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: premium49.web-hosting.com
          server_port: 465
          username: ${{ secrets.REPORT_FROM_MAIL }}
          password: ${{ secrets.REPORT_FROM_PASSWORD }}
          subject: "Inventor Market - QA Automation Complete: ${{ env.PASSED }}/${{ env.TOTAL }} Passed"
          body: |
            Inventor Market – QA Automation Summary
            Execution Status: Completed

            SUMMARY:
            ✅ Passed: ${{ env.PASSED }}
            ❌ Failed: ${{ env.FAILED }}

            ${{ env.REPORT_SECTION }}

            📋 Note:
            1. The test suite was executed sequentially to improve stability.
            2. UI animations were disabled during execution to ensure consistent and reliable visual comparisons.

          to: ${{ secrets.REPORT_TO_MAILS }}
          from: "QA Automation Bot"
