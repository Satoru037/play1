# @format

name: Cleanup old Drive reports (30 days)

on:
  schedule:
    # Runs daily at 04:30 UTC (10:00 IST)
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      ageDays:
        description: "Delete Drive reports older than this many days"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete Drive reports older than 30 days
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Cleanup Google Drive reports
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          REPORT_RETENTION_DAYS: ${{ inputs.ageDays || '30' }}
        run: |
          node scripts/cleanupDriveReports.js
