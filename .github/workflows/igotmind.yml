# @format

name: "I Got Mind: Automation"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # Monday 9:00 AM IST (3:30 AM UTC)

permissions:
  contents: read
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        continue-on-error: true
        run: npx playwright test --config=igotmind/playwright.config.js --update-snapshots
        env:
          TEST_EMAIL: ${{ secrets.IGOTMIND_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.IGOTMIND_TEST_PASSWORD }}

      - name: Move Reports to Site Folder
        if: always()
        run: |
          mkdir -p igotmind

          if [ -d "playwright-report" ]; then
            rm -rf igotmind/playwright-report
            mv playwright-report igotmind/
            echo "✅ Moved HTML Report"
          fi

          if [ -f "results.json" ]; then
            mv results.json igotmind/
            echo "✅ Moved JSON Results"
          fi

      - name: Calculate Test Stats
        if: always()
        run: |
          node -e "
            try {
              const fs = require('fs');
              if (fs.existsSync('./igotmind/results.json')) {
                const r = require('./igotmind/results.json');
                const passed = r.stats.expected + r.stats.flaky;
                const failed = r.stats.unexpected;
                console.log('PASSED=' + passed);
                console.log('FAILED=' + failed);
                console.log('TOTAL=' + (passed + failed));
              } else {
                console.log('PASSED=0');
                console.log('FAILED=Error');
                console.log('TOTAL=0');
              }
            } catch (e) {
              console.log('PASSED=0');
              console.log('FAILED=Crash');
              console.log('TOTAL=0');
            }
          " >> $GITHUB_ENV

      - name: Upload Report Artifact
        id: upload_report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: igotmind/playwright-report/
          retention-days: 2

      - name: Prepare Report Message
        if: always()
        run: |
          if [ "${{ steps.upload_report.outcome }}" = "success" ]; then
            echo "REPORT_SECTION<<EOF" >> $GITHUB_ENV
            echo "📂 DOWNLOAD FULL REPORT:" >> $GITHUB_ENV
            echo "1. Open the link ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
            echo "2. Navigate to the \"Artifacts\" section." >> $GITHUB_ENV
            echo "3. Click \"playwright-report\" to download the ZIP file." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "REPORT_SECTION<<EOF" >> $GITHUB_ENV
            echo "⚠️ ARTIFACT UPLOAD ERROR:" >> $GITHUB_ENV
            echo "The Playwright report artifact could not be uploaded (likely due to GitHub Actions storage/quota limits)." >> $GITHUB_ENV
            echo "Please open this run and check the Upload Report Artifact step logs:" >> $GITHUB_ENV
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: premium49.web-hosting.com
          server_port: 465
          username: ${{ secrets.REPORT_FROM_MAIL }}
          password: ${{ secrets.REPORT_FROM_PASSWORD }}
          subject: "I Got Mind - QA Automation Complete: ${{ env.PASSED }}/${{ env.TOTAL }} Passed"
          body: |
            I Got Mind – QA Automation Summary
            Execution Status: Completed

            SUMMARY:
            ✅ Passed: ${{ env.PASSED }}
            ❌ Failed: ${{ env.FAILED }}

            ${{ env.REPORT_SECTION }}

            ⚠️ Note:
            1. The test suite was executed sequentially to improve stability.
            2. UI animations were disabled during execution to ensure consistent and reliable visual comparisons.

          to: ${{ secrets.REPORT_TO_MAILS }}
          from: "QA Automation Bot"
