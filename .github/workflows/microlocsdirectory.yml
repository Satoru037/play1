# @format

name: "Microloc Directory: Automation"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 2" # Tuesday 9:00 AM IST (03:30 AM UTC)

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    env:
      PASSED: "0"
      FAILED: "0"
      TOTAL: "0"
      REPORT_AVAILABLE: "false"
      REPORT_SECTION: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        id: run_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test --config=microlocsdirectory/playwright.config.js --workers=1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          CI: true

      - name: Move Reports to Site Folder
        if: always()
        run: |
          mkdir -p microlocsdirectory

          if [ -d "playwright-report" ]; then
            rm -rf microlocsdirectory/playwright-report
            mv playwright-report microlocsdirectory/
            echo "✅ Moved HTML Report"
          fi

          if [ -f "results.json" ]; then
            mv results.json microlocsdirectory/
            echo "✅ Moved JSON Results"
          fi

      - name: Detect Report Availability
        if: always()
        shell: bash
        run: |
          if [ -d "microlocsdirectory/playwright-report" ] && \
             [ -f "microlocsdirectory/playwright-report/index.html" ]; then
            echo "REPORT_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "REPORT_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Calculate Test Stats
        if: always()
        run: |
          node -e "
            try {
              const fs = require('fs');
              if (fs.existsSync('./microlocsdirectory/results.json')) {
                const r = require('./microlocsdirectory/results.json');
                const passed = r.stats.expected + r.stats.flaky;
                const failed = r.stats.unexpected;
                console.log('PASSED=' + passed);
                console.log('FAILED=' + failed);
                console.log('TOTAL=' + (passed + failed));
              } else {
                console.log('PASSED=0');
                console.log('FAILED=Error');
                console.log('TOTAL=0');
              }
            } catch (e) {
              console.log('PASSED=0');
              console.log('FAILED=Crash');
              console.log('TOTAL=0');
            }
          " >> $GITHUB_ENV

      # =========================
      # GOOGLE DRIVE (OAUTH FLOW)
      # =========================

      - name: Zip Playwright Report
        if: always() && env.REPORT_AVAILABLE == 'true'
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y zip >/dev/null
          cd microlocsdirectory
          zip -r playwright-report.zip playwright-report

      - name: Upload Report to Google Drive
        if: always() && env.REPORT_AVAILABLE == 'true'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          node scripts/uploadToDrive.js >> $GITHUB_ENV

      - name: Prepare Report Message
        if: always()
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "REPORT_SECTION<<EOF"

            if [ "${REPORT_AVAILABLE}" = "true" ] && [ -n "${REPORT_LINK:-}" ]; then
              echo "📂 DOWNLOAD FULL REPORT:"
              echo "${REPORT_LINK}"
            else
              echo "⚠️ ISSUE SUMMARY:"

              if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
                echo "- Tests failed (exit code: ${{ steps.run_tests.outputs.exit_code }})"
              else
                echo "- Tests step outcome: ${{ steps.run_tests.outcome }}"
              fi

              if [ "${REPORT_AVAILABLE}" != "true" ]; then
                echo "- Report not generated (microlocsdirectory/playwright-report missing)"
              else
                echo "- Report generated but Drive upload failed"
              fi

              echo ""
              echo "Run logs: $RUN_URL"
            fi

            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: premium49.web-hosting.com
          server_port: 465
          username: ${{ secrets.REPORT_FROM_MAIL }}
          password: ${{ secrets.REPORT_FROM_PASSWORD }}
          subject: "Microloc Directory - QA Automation Complete: ${{ env.PASSED }}/${{ env.TOTAL }} Passed"
          body: |
            Microloc Directory – QA Automation Summary
            Execution Status: Completed

            SUMMARY:
            ✅ Passed: ${{ env.PASSED }}
            ❌ Failed: ${{ env.FAILED }}

            ${{ env.REPORT_SECTION }}

            📋 Note:
            1. The test suite was executed sequentially to improve stability.
            2. UI animations were disabled during execution to ensure consistent and reliable visual comparisons.

          to: ${{ secrets.REPORT_TO_MAILS }}
          from: "QA Automation Bot"
